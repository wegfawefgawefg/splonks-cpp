plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.splonks.game'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.splonks.game'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DSPLONKS_MODE=release',
                          '-DSPLONKS_FETCH_DEPS=ON',
                          '-DSPLONKS_STRICT=ON',
                          '-DSPLONKS_WARN_AS_ERROR=ON'
                targets 'splonks-cpp'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        prefab true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def generatedAssetsDir = layout.buildDirectory.dir('generated/splonksAssets')

tasks.register('syncSplonksAssets', Copy) {
    into generatedAssetsDir
    from('../../assets') {
        into 'assets'
    }
    from('../../data') {
        into 'data'
    }
}

android.sourceSets.main.assets.srcDir(generatedAssetsDir)
preBuild.dependsOn syncSplonksAssets

dependencies {
    implementation fileTree(dir: 'libs', include: ['SDL3*.aar'])
}
