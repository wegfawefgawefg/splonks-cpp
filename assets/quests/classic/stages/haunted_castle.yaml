id: haunted_castle
title: Haunted Castle
generator: classic_room_graph
room_size: [10, 8]
layout_size: [4, 4]
glyphs: glyphs/haunted_castle.yaml
border_tile: temple_dirt
backwall_tiles: [temple_air0, temple_air1, temple_air2]
block_animation: temple_block

room_pools:
  start: rooms/temple/start
  main: rooms/temple/main
  side: rooms/temple/side
  drop: rooms/temple/drop
  exit: rooms/temple/exit
  exit_main: rooms/temple/exit_main
  shop_left: rooms/temple/shop_left
  shop_right: rooms/temple/shop_right

layout_passes:
  - name: snake_pit
    enabled: false
    properties:
      chance_denominator: 8

  - name: shop
    enabled: false
    properties:
      min_level_number: 2
      chance_uses_level_number: true

stage_passes:
  - name: convert_exit_tiles
    enabled: true
  - name: embedded_treasure
    enabled: true
  - name: floor_treasure
    enabled: true
  - name: udjat_key_chest
    enabled: false
    properties:
      min_level_number: 2
  - name: arrow_trap_conversion
    enabled: true
  - name: ambient_haunted_castle_entities
    enabled: true
