name: package

on:
  push:
  pull_request:

jobs:
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libudev-dev
      - name: Build and verify Linux package
        run: |
          ./scripts/build.sh
          ./scripts/verify_package_linux.sh

  android-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android scripts and pinned SDL3 AAR fetch
        run: |
          bash -n scripts/android/*.sh
          ./scripts/android/fetch_sdl3_aar.sh
          test -f android/app/libs/SDL3-3.4.0.aar
