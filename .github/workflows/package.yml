name: package

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version used in artifact names, for example 0.1.0'
        required: false
        default: '0.1.0'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        run: |
          version="${{ github.event.inputs.release_version }}"
          if [[ -z "${version}" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "SPLONKS_RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libudev-dev
      - name: Build and verify Linux package
        run: |
          ./scripts/verify_package_linux.sh
          ./scripts/archive_release.sh linux
          ./scripts/verify_release_archive.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: splonks-linux-release
          path: |
            dist/releases/splonks-*-linux-x86_64.tar.gz
            dist/releases/splonks-*-linux-x86_64.tar.gz.sha256

  macos-package:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        run: |
          version="${{ github.event.inputs.release_version }}"
          if [[ -z "${version}" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "SPLONKS_RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Install native build dependencies
        run: brew install cmake ninja pkg-config
      - name: Build and verify macOS package
        run: |
          ./scripts/verify_package_macos.sh
          ./scripts/archive_release.sh macos
          ./scripts/verify_release_archive.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: splonks-macos-release
          path: |
            dist/releases/splonks-*-macos-universal.zip
            dist/releases/splonks-*-macos-universal.zip.sha256

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        run: |
          version="${{ github.event.inputs.release_version }}"
          if [[ -z "${version}" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "SPLONKS_RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build and verify Windows package
        run: |
          ./scripts/verify_package_windows.sh
          ./scripts/archive_release.sh windows
          ./scripts/verify_release_archive.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: splonks-windows-release
          path: |
            dist/releases/splonks-*-windows-x86_64.zip
            dist/releases/splonks-*-windows-x86_64.zip.sha256

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      SPLONKS_ANDROID_KEYSTORE_BASE64: ${{ secrets.SPLONKS_ANDROID_KEYSTORE_BASE64 }}
      SPLONKS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SPLONKS_ANDROID_KEYSTORE_PASSWORD }}
      SPLONKS_ANDROID_KEY_ALIAS: ${{ secrets.SPLONKS_ANDROID_KEY_ALIAS }}
      SPLONKS_ANDROID_KEY_PASSWORD: ${{ secrets.SPLONKS_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set release version
        run: |
          version="${{ github.event.inputs.release_version }}"
          if [[ -z "${version}" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "SPLONKS_RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "SPLONKS_ANDROID_VERSION_NAME=${version}" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify Android scripts
        run: |
          bash -n scripts/android/*.sh
      - name: Install Android SDK packages
        run: ./scripts/android/setup_sdk.sh
      - name: Fetch pinned SDL3 Android AAR
        run: |
          ./scripts/android/fetch_sdl3_aar.sh
          test -f android/app/libs/SDL3-3.4.0.aar
      - name: Build Android emulator APK
        run: SPLONKS_ANDROID_ABIS=x86_64 ./scripts/android/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: splonks-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed Android release AAB
        if: ${{ env.SPLONKS_ANDROID_KEYSTORE_BASE64 != '' && env.SPLONKS_ANDROID_KEYSTORE_PASSWORD != '' && env.SPLONKS_ANDROID_KEY_ALIAS != '' && env.SPLONKS_ANDROID_KEY_PASSWORD != '' }}
        run: |
          keystore_path="${RUNNER_TEMP}/splonks-upload.jks"
          printf '%s' "${SPLONKS_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          export SPLONKS_ANDROID_KEYSTORE="${keystore_path}"
          ./scripts/android/build_release_aab.sh
      - uses: actions/upload-artifact@v4
        if: ${{ env.SPLONKS_ANDROID_KEYSTORE_BASE64 != '' && env.SPLONKS_ANDROID_KEYSTORE_PASSWORD != '' && env.SPLONKS_ANDROID_KEY_ALIAS != '' && env.SPLONKS_ANDROID_KEY_PASSWORD != '' }}
        with:
          name: splonks-android-release-aab
          path: |
            dist/splonks-android/splonks-*-android-release.aab
            dist/splonks-android/manifest.txt
