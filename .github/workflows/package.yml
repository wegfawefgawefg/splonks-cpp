name: package

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libudev-dev
      - name: Build and verify Linux package
        run: |
          ./scripts/build.sh
          ./scripts/verify_package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: splonks-linux
          path: dist/splonks-linux

  macos-package:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: brew install cmake ninja pkg-config
      - name: Build and verify macOS package
        run: |
          ./scripts/build.sh
          ./scripts/verify_package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: splonks-macos
          path: dist/splonks-macos

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build and verify Windows package
        run: |
          ./scripts/build.sh
          ./scripts/verify_package_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: splonks-windows
          path: dist/splonks-windows

  android-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify Android scripts
        run: |
          bash -n scripts/android/*.sh
      - name: Install Android SDK packages
        run: ./scripts/android/setup_sdk.sh
      - name: Fetch pinned SDL3 Android AAR
        run: |
          ./scripts/android/fetch_sdl3_aar.sh
          test -f android/app/libs/SDL3-3.4.0.aar
      - name: Build Android debug APK
        run: ./scripts/android/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: splonks-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
